name: Optional official source diagnostics
on:
  workflow_dispatch:
  push:
    branches: [codex/v0.2-regional-expansion]
permissions:
  contents: read
jobs:
  probe:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[probe-sources]')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Optional diagnostics, not an acceptance gate
        run: python -m scripts.probe_central_sources
