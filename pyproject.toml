[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "regional-analytics"
version = "0.2.0"
description = "Региональная аналитика — Навигатор детства"
requires-python = ">=3.11"
dependencies = ["fastapi>=0.115,<1", "uvicorn>=0.30,<1", "SQLAlchemy>=2.0,<3", "alembic>=1.13,<2", "psycopg[binary]>=3.2,<4", "pydantic-settings>=2.6,<3", "streamlit>=1.40,<2", "pandas>=2.2,<4", "openpyxl>=3.1,<4", "httpx>=0.27,<1", "plotly>=5.24,<7", "pypdf>=5,<7"]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.9,<1", "pip-audit>=2.9,<3", "pytest-playwright>=0.7,<1"]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-m 'not postgres and not browser'"
markers = ["postgres: requires isolated PostgreSQL 16, mandatory in CI", "browser: browser acceptance against running Docker services"]

[tool.ruff]
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
