services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-regional}
      POSTGRES_USER: ${POSTGRES_USER:-regional}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 5s
      timeout: 5s
      retries: 20
  init:
    build: .
    env_file: .env
    depends_on:
      db:
        condition: service_healthy
    command: sh -c "alembic upgrade head && python -m scripts.seed && python -m scripts.load_official_bundle"
  api:
    build: .
    env_file: .env
    ports: ["127.0.0.1:8000:8000"]
    volumes: ["./data:/app/data"]
    depends_on:
      init:
        condition: service_completed_successfully
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/health')"]
      interval: 10s
      timeout: 5s
      retries: 10
  ui:
    build: .
    env_file: .env
    ports: ["127.0.0.1:8501:8501"]
    command: streamlit run app/ui/main.py --server.address=0.0.0.0 --server.headless=true --browser.gatherUsageStats=false
    depends_on:
      api:
        condition: service_healthy
    volumes: ["./data:/app/data"]
volumes:
  postgres_data:
